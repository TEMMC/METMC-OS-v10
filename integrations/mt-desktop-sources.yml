# MT desktop integration manifest
# Source is fetched at build time into CI workspaces; no boot-time network access.
# Keep these refs explicit so the desktop build is reproducible.
version: 1
project: MT OS
components:
  android_linux_bridge:
    source: local
    path: linux/bridge-client
    android_source: android/app/src/main/java/com/nativOS/bridge
    runtime: bundled-in-android-apk
  mt_phosh:
    repository: https://github.com/TEMMC/MT-phosh-.git
    branch: mt-gnome-shell
    ref: a666684c70338867034f889545d1b1da49e8cb64
    path: integrations/sources/MT-phosh
    runtime: compiled-and-overlaid-in-apk-rootfs
  mt_phoc:
    repository: https://github.com/TEMMC/MT-phoc.git
    branch: fedora-phoc-0.47.0
    ref: 7207050415b30a99a985277dcca8a3393086d918
    path: integrations/sources/MT-phoc
    runtime: source-bundle-only
compatibility:
  current_apk_rootfs: Ubuntu/Debian ARM64 rootfs from the upstream NativOS APK, provisioned with apt during CI
  runtime_desktop: MT-Phosh and MT-Phoc install trees are compiled on native Ubuntu ARM64 runners and overlaid into the bundled rootfs; distro packages remain for shared runtime dependencies
  mt_forks: pinned source commits compiled during the APK workflow; install trees replace the packaged Phosh/Phoc files in the APK rootfs
  reason: "The experimental MT-Phoc branch repeatedly failed against wlroots 0.18. The APK workflow now compiles the pinned fork source directly against Ubuntu ARM64 build dependencies; CI must confirm this exact build."
  required_next_step: "Verify both source builds, APK build, artifact signing, and runtime compatibility on Galaxy A04e."
