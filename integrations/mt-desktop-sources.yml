# MT desktop integration manifest
# Source is fetched at build time into CI workspaces; no boot-time network access.
# Keep these refs explicit so the desktop build is reproducible.
version: 1
project: MT OS
components:
  android_linux_bridge:
    source: local
    path: linux/bridge-client
    android_source: android/app/src/main/java/com/nativOS/bridge
    runtime: bundled-in-android-apk
  mt_phosh:
    repository: https://github.com/TEMMC/MT-phosh-.git
    branch: mt-gnome-shell
    ref: a666684c70338867034f889545d1b1da49e8cb64
    path: integrations/sources/MT-phosh
    runtime: source-bundle-only
  mt_phoc:
    repository: https://github.com/TEMMC/MT-phoc.git
    branch: fedora-phoc-0.47.0
    ref: 7207050415b30a99a985277dcca8a3393086d918
    path: integrations/sources/MT-phoc
    runtime: source-bundle-only
compatibility:
  current_apk_rootfs: Ubuntu/Debian ARM64 rootfs from the upstream NativOS APK, provisioned with apt during CI
  runtime_desktop: distro-packaged Phosh/Phoc retained as the safe fallback
  mt_forks: pinned source bundle only; fork binaries are not yet installed in the APK
  reason: "The experimental MT-Phoc branch repeatedly failed against wlroots 0.18. The selected Fedora-tested baseline build passed, but its workflow compiles upstream Phoc v0.47.0 rather than proving every fork modification is runtime-safe."
  required_next_step: "Build and stage the selected MT-Phosh and stable MT-Phoc baseline against the same Ubuntu ARM64 rootfs before enabling fork binaries at startup."
