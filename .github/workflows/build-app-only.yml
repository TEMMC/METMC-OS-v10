name: The Update

on:
  workflow_dispatch:
  push:
    branches: [build/app-only-external-rootfs]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-app-only:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Restore MT OS signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.METMC_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64}" || { echo "::error::Missing METMC_SIGNING_KEYSTORE_BASE64 secret"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "$HOME/.android/mt-os-release.keystore"
          test -s "$HOME/.android/mt-os-release.keystore"
          chmod 600 "$HOME/.android/mt-os-release.keystore"

      - name: Build app without a Linux rootfs payload
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          if unzip -l "$APK" | grep -E 'assets/rootfs/.*(\.tar|\.tgz|\.tar\.gz)$'; then
            echo "::error::Rootfs archive was unexpectedly packaged in the APK"
            exit 1
          fi
          SIZE="$(stat -c %s "$APK")"
          test "$SIZE" -lt 100000000
          echo "Verified app-only APK: $SIZE bytes; no rootfs archive embedded."

      - name: Sign app-only APK
        working-directory: android
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.METMC_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.METMC_SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.METMC_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          KEY="$HOME/.android/mt-os-release.keystore"
          test -n "$STORE_PASSWORD" && test -n "$KEY_PASSWORD" && test -n "$KEY_ALIAS" || {
            echo "::error::Missing MT OS signing password/alias secrets"; exit 1;
          }
          keytool -list -keystore "$KEY" -storetype PKCS12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEY" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$APK.signed" "$APK"
          mv "$APK.signed" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.temmc.metmcosv10'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload app-only APK
        uses: actions/upload-artifact@v4
        with:
          name: MT-OS-The-Update
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
