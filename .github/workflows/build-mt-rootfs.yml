name: Build MT OS Rootfs (Phosh + Phoc + Android Bridge)

on:
  workflow_dispatch:
  push:
    branches: [build/app-only-external-rootfs]
    paths:
      - ".github/workflows/build-mt-rootfs.yml"
      - "linux/bridge-client/**"
      - "linux/config/phoc.ini"
      - "linux/config/nativOS-bridge.service"
      - "linux/setup/install-bridge.sh"

permissions:
  contents: read

jobs:
  build-rootfs:
    # Native ARM64: the Ubuntu base system and chroot binaries run natively.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout MT OS integration
        uses: actions/checkout@v4

      - name: Install host build tools and resolve Ubuntu source dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/s/Types: deb/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git debootstrap unzip xz-utils gzip tar rsync \
            build-essential pkg-config meson ninja-build cmake python3 python3-dbus
          # Let Ubuntu's own source metadata provide the exact build dependencies.
          sudo apt-get build-dep -y phoc phosh

      - name: Create a clean Ubuntu 24.04 ARM64 rootfs and install the desktop runtime
        shell: bash
        run: |
          set -euxo pipefail
          ROOTFS="$RUNNER_TEMP/mt-rootfs"
          sudo mkdir -p "$ROOTFS"
          sudo debootstrap --arch=arm64 --variant=minbase noble "$ROOTFS" http://ports.ubuntu.com/ubuntu-ports
          sudo tee "$ROOTFS/etc/apt/sources.list" >/dev/null <<'APT'
          deb http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse
          deb http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse
          deb http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse
          APT
          sudo cp /etc/resolv.conf "$ROOTFS/etc/resolv.conf"
          sudo mount --bind /dev "$ROOTFS/dev"
          sudo mount -t proc proc "$ROOTFS/proc"
          sudo mount -t sysfs sysfs "$ROOTFS/sys"
          cleanup() {
            sudo umount -lf "$ROOTFS/sys" 2>/dev/null || true
            sudo umount -lf "$ROOTFS/proc" 2>/dev/null || true
            sudo umount -lf "$ROOTFS/dev" 2>/dev/null || true
          }
          trap cleanup EXIT
          sudo chroot "$ROOTFS" /usr/bin/env DEBIAN_FRONTEND=noninteractive bash -euxc '
            apt-get update
            apt-get install -y --no-install-recommends \
              systemd dbus dbus-user-session sudo ca-certificates \
              phosh phoc gnome-console nautilus gnome-control-center \
              gsettings-desktop-schemas gnome-settings-daemon-common \
              adwaita-icon-theme hicolor-icon-theme fonts-cantarell \
              xwayland xwayland-run weston foot python3 python3-dbus \
              python3-gi python3-gi-cairo python3-pip python3-requests \
              network-manager pipewire-audio wireplumber \
              libinput-tools mesa-utils desktop-file-utils \
              policykit-1 udev iproute2 iputils-ping
            apt-get clean
            rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
            mkdir -p /tmp /run /var/tmp
            chmod 1777 /tmp /var/tmp
          '
          cleanup
          trap - EXIT
          echo "ROOTFS=$ROOTFS" >> "$GITHUB_ENV"

      - name: Build MT-Phoc from TEMMC fork
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/TEMMC/MT-phoc.git "$RUNNER_TEMP/MT-phoc"
          git -C "$RUNNER_TEMP/MT-phoc" checkout 7207050415b30a99a985277dcca8a3393086d918
          meson setup "$RUNNER_TEMP/MT-phoc/build" "$RUNNER_TEMP/MT-phoc" \
            --prefix=/usr --libdir=lib/aarch64-linux-gnu --buildtype=release \
            -Dtests=false
          ninja -C "$RUNNER_TEMP/MT-phoc/build"
          sudo DESTDIR="$ROOTFS" ninja -C "$RUNNER_TEMP/MT-phoc/build" install

      - name: Build MT-Phosh from TEMMC fork
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/TEMMC/MT-phosh-.git "$RUNNER_TEMP/MT-phosh"
          git -C "$RUNNER_TEMP/MT-phosh" checkout a666684c70338867034f889545d1b1da49e8cb64
          meson setup "$RUNNER_TEMP/MT-phosh/build" "$RUNNER_TEMP/MT-phosh" \
            --prefix=/usr --libdir=lib/aarch64-linux-gnu --buildtype=release \
            -Dtests=false
          ninja -C "$RUNNER_TEMP/MT-phosh/build"
          sudo DESTDIR="$ROOTFS" ninja -C "$RUNNER_TEMP/MT-phosh/build" install

      - name: Install MT-Bridge and preserve NativOS Android display configuration
        shell: bash
        run: |
          set -euxo pipefail
          sudo install -d "$ROOTFS/usr/local/bin" "$ROOTFS/etc/nativOS" \
            "$ROOTFS/etc/systemd/system" "$ROOTFS/run/nativOS" "$ROOTFS/usr/share/mt-os"
          git clone https://github.com/TEMMC/METMC-OS-v10.git "$RUNNER_TEMP/mt-bridge-source"
          git -C "$RUNNER_TEMP/mt-bridge-source" checkout 231f82fcc6a49d03603870457b808381d75936ae
          BRIDGE="$RUNNER_TEMP/mt-bridge-source"
          python3 -m py_compile "$BRIDGE/linux/bridge-client/bridge_transport.py" "$BRIDGE/linux/bridge-client/nativOS-bridge.py" "$BRIDGE/linux/bridge-client/mt-bridge.py" "$BRIDGE/linux/bridge-client/metmc-settings.py" "$BRIDGE/linux/bridge-client/metmc-wifi.py"
          sudo install -m 0755 "$BRIDGE/linux/bridge-client/nativOS-bridge.py" "$ROOTFS/usr/local/bin/nativOS-bridge"
          sudo install -m 0755 "$BRIDGE/linux/bridge-client/mt-bridge.py" "$ROOTFS/usr/local/bin/mt-bridge"
          sudo install -m 0755 "$BRIDGE/linux/bridge-client/metmc-settings.py" "$ROOTFS/usr/local/bin/mt-settings"
          sudo install -m 0755 "$BRIDGE/linux/bridge-client/metmc-wifi.py" "$ROOTFS/usr/local/bin/mt-wifi"
          sudo install -m 0644 "$BRIDGE/linux/config/nativOS-bridge.service" "$ROOTFS/etc/systemd/system/nativOS-bridge.service"
          sudo install -m 0644 "$BRIDGE/linux/README-bridge.md" "$ROOTFS/usr/share/mt-os/README-bridge.md"
          curl -fL --retry 5 --retry-all-errors \
            https://raw.githubusercontent.com/orailnoor/NativOS/main/linux/config/phoc.ini \
            -o "$RUNNER_TEMP/phoc-nativos.ini"
          sudo install -m 0644 "$RUNNER_TEMP/phoc-nativos.ini" "$ROOTFS/etc/nativOS/phoc.ini"
          sudo cp "$ROOTFS/etc/nativOS/phoc.ini" "$ROOTFS/usr/share/mt-os/phoc-nativos-reference.ini"
          sudo tee "$ROOTFS/usr/share/mt-os/MT-ROOTFS-MANIFEST.txt" >/dev/null <<'EOF'
          MT OS external rootfs
          Base: Ubuntu 24.04 ARM64
          Display configuration: original NativOS linux/config/phoc.ini, preserved byte-for-byte
          Desktop source: TEMMC/MT-phosh- at a666684c70338867034f889545d1b1da49e8cb64
          Compositor source: TEMMC/MT-phoc at 7207050415b30a99a985277dcca8a3393086d918
          Android bridge: standalone bridge snapshot at 231f82fcc6a49d03603870457b808381d75936ae
          Target: ARM64 Android chroot; not a flashable ROM
          EOF

      - name: Validate binaries, display config, and package rootfs
        shell: bash
        run: |
          set -euxo pipefail
          test -x "$ROOTFS/usr/bin/phosh"
          test -x "$ROOTFS/usr/bin/phoc"
          test -x "$ROOTFS/usr/local/bin/nativOS-bridge"
          test -x "$ROOTFS/usr/local/bin/mt-bridge"
          test -s "$ROOTFS/etc/nativOS/phoc.ini"
          cmp "$ROOTFS/etc/nativOS/phoc.ini" "$ROOTFS/usr/share/mt-os/phoc-nativos-reference.ini"
          grep -q 'scale = 2' "$ROOTFS/etc/nativOS/phoc.ini"
          mkdir -p "$RUNNER_TEMP/output"
          sudo tar --numeric-owner --owner=0 --group=0 --xattrs --acls \
            --exclude='./dev/*' --exclude='./proc/*' --exclude='./sys/*' \
            -C "$ROOTFS" -czf "$RUNNER_TEMP/output/MT-OS-Rootfs-arm64.tar.gz" .
          sha256sum "$RUNNER_TEMP/output/MT-OS-Rootfs-arm64.tar.gz" \
            | tee "$RUNNER_TEMP/output/SHA256SUMS.txt"
          du -h "$RUNNER_TEMP/output/MT-OS-Rootfs-arm64.tar.gz"
          tar -tzf "$RUNNER_TEMP/output/MT-OS-Rootfs-arm64.tar.gz" \
            | grep -E '(^|/)(phosh|phoc|mt-bridge|nativOS-bridge)$|etc/nativOS/phoc.ini|MT-ROOTFS-MANIFEST'

      - name: Upload separate MT OS rootfs
        uses: actions/upload-artifact@v4
        with:
          name: MT-OS-Rootfs-arm64-Phosh-Phoc-Bridge
          path: |
            ${{ runner.temp }}/output/MT-OS-Rootfs-arm64.tar.gz
            ${{ runner.temp }}/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
