name: Sync from NativOS upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out METMC OS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream source and preserve METMC branding
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_DIR="$(mktemp -d)"
          git clone --depth 1 --branch main https://github.com/orailnoor/NativOS.git "$UPSTREAM_DIR/NativOS"
          cp README.md "$UPSTREAM_DIR/METMC_README.md"
          mkdir -p docs
          cp "$UPSTREAM_DIR/NativOS/README.md" docs/UPSTREAM_README.md
          rsync -a --exclude='.git/' --exclude='.github/workflows/sync-upstream.yml' "$UPSTREAM_DIR/NativOS/" ./
          cp "$UPSTREAM_DIR/METMC_README.md" README.md
          printf '\n\n> Upstream source imported from [orailnoor/NativOS](https://github.com/orailnoor/NativOS). Review upstream notices and licenses before redistribution.\n' >> README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No upstream changes to import.'
            exit 0
          fi
          git commit -m 'Sync upstream NativOS source [skip ci]'
          git push origin HEAD:main
