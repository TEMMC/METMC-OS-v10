name: Build METMC OS v10 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "linux/config/phoc.ini"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: metmc-os-v10-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # Reuse the same Android debug keystore across builds, matching v10.1.0-alpha.
      # This preserves update compatibility while avoiding missing repository secrets.
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: metmc-os-v10-debug-signing-v1

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Download upstream rootfs from official NativOS APK
        shell: bash
        run: |
          set -euo pipefail
          APK_URL="https://github.com/orailnoor/NativOS/releases/download/v0.1.0-alpha/NativOS-v0.1.0-alpha-arm64.apk"
          curl --fail --location --retry 3 --output /tmp/nativos-upstream.apk "$APK_URL"
          unzip -l /tmp/nativos-upstream.apk | grep -F "assets/rootfs/nativos-rootfs-arm64.tgz"
          mkdir -p android/app/src/main/assets/rootfs
          unzip -p /tmp/nativos-upstream.apk assets/rootfs/nativos-rootfs-arm64.tgz > android/app/src/main/assets/rootfs/nativos-rootfs-arm64.tgz
          test "$(stat -c %s android/app/src/main/assets/rootfs/nativos-rootfs-arm64.tgz)" -gt 104857600
          cd android/app/src/main/assets/rootfs
          sha256sum nativos-rootfs-arm64.tgz > nativos-rootfs-arm64.tgz.sha256
          sha256sum --check nativos-rootfs-arm64.tgz.sha256

      - name: Build and verify APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify package and APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.temmc.metmcosv10'|application-label:'METMC OS version 10'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-v10-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Publish METMC OS v10 v10.1.1-alpha')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: METMC-OS-v10-Android-APK
          path: release-assets

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -maxdepth 4 -print
          APK="$(find release-assets -type f -name 'app-debug.apk' -print -quit)"
          CHECKSUM="$(find release-assets -type f -name 'app-debug.apk.sha256' -print -quit)"
          test -n "$APK"
          test -n "$CHECKSUM"
          cp "$APK" METMC-OS-v10.1.1-alpha-arm64.apk
          (cd "$(dirname "$CHECKSUM")" && sha256sum "$(basename "$CHECKSUM")" >/dev/null)
          sha256sum METMC-OS-v10.1.1-alpha-arm64.apk > METMC-OS-v10.1.1-alpha-arm64.apk.sha256
          echo "Release APK prepared and checksum generated."

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.1.1-alpha
          name: METMC OS v10.1.1-alpha
          prerelease: true
          generate_release_notes: true
          body: |
            METMC OS v10.1.1 alpha update for Android ARM64, signed with the persistent METMC release key.

            - Package ID: `com.temmc.metmcosv10`
            - App label: `METMC OS version 10`
            - Based on the upstream NativOS project; upstream credits are retained.
            - METMC OS branding and updated launcher icon.
            - Hardware bridge improvements for battery/charging status, brightness controls, volume controls, and screen sleep/wake preferences.
            - Clipboard bridge hooks and improved touch-focus handling.
            - CPU/RAM usage information in Settings.
            - Includes compact Phoc display scaling and a Phosh animation-disable tweak.
            - This is an alpha build. Touch responsiveness and hardware acceleration may vary by device.
            - APK is signed with the persistent METMC release key; this is not Play Store certification.
          files: |
            METMC-OS-v10.1.1-alpha-arm64.apk
            METMC-OS-v10.1.1-alpha-arm64.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
