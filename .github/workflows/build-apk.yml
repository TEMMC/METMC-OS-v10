name: Build METMC OS v10 APK

# METMC OS V10 v10.8.0: prepare Linux packages during CI so device boot never needs network access.
# Rootfs package changes happen in GitHub Actions; runtime boot uses only the bundled rootfs.

on:
  workflow_dispatch:
  push:
    branches: [main, fix/restore-known-working-phosh]
    paths:
      - "android/**"
      - "linux/config/**"
      - "linux/bridge-client/**"
      - "linux/setup/**"
      - "linux/README-bridge.md"
      - "integrations/**"
      - "android/app/src/main/java/com/nativOS/bridge/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: metmc-os-v10-app-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # App-only rebuild: reuse the exact rootfs from the last successful APK build.
      # This deliberately does NOT download packages, unpack a distro, install MT desktop
      # artifacts, or modify/rebuild the rootfs.
      - name: Download last successful APK artifact
        uses: actions/download-artifact@v4
        with:
          name: METMC-OS-v10-Android-APK
          run-id: 40691408689
          path: /tmp/known-good-apk

      - name: Restore unchanged rootfs asset from successful APK
        shell: bash
        run: |
          set -euo pipefail
          BASE_APK="/tmp/known-good-apk/app-debug.apk"
          test -s "$BASE_APK"
          mkdir -p android/app/src/main/assets/rootfs
          unzip -p "$BASE_APK" assets/rootfs/nativos-rootfs-arm64.tar > android/app/src/main/assets/rootfs/nativos-rootfs-arm64.tar
          test "$(stat -c %s android/app/src/main/assets/rootfs/nativos-rootfs-arm64.tar)" -gt 104857600
          cd android/app/src/main/assets/rootfs
          sha256sum nativos-rootfs-arm64.tar > nativos-rootfs-arm64.tar.sha256
          sha256sum --check nativos-rootfs-arm64.tar.sha256
          echo "Reusing the existing successful rootfs unchanged."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Restore METMC OS release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.METMC_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::Add the METMC_SIGNING_KEYSTORE_BASE64 repository secret before running this build."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/metmc-os-v10-release.keystore"
          test -s "$HOME/.android/metmc-os-v10-release.keystore"
          chmod 600 "$HOME/.android/metmc-os-v10-release.keystore"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build and verify APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Sign APK with METMC OS release key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.METMC_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.METMC_SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.METMC_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          KEY="$HOME/.android/metmc-os-v10-release.keystore"
          if [[ -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Add METMC_SIGNING_STORE_PASSWORD, METMC_SIGNING_KEY_PASSWORD, and METMC_SIGNING_KEY_ALIAS repository secrets."
            exit 1
          fi
          keytool -list -keystore "$KEY" -storetype PKCS12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEY" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$APK.signed" "$APK"
          mv "$APK.signed" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.temmc.metmcosv10'|application-label:'METMC OS V10'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload app-only installable APK
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-v10-App-Only-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

