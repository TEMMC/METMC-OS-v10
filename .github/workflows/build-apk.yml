          files: |
            MT-OS-V10.9.0-arm64.apk
            MT-OS-V10.9.0-arm64.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
 /tmp/mt-rootfs-toybox-test/etc/os-release
          test -x /tmp/mt-rootfs-toybox-test/usr/bin/phosh-session
          test -x /tmp/mt-rootfs-toybox-test/usr/libexec/phosh
          test -x /tmp/mt-rootfs-toybox-test/usr/local/bin/phoc
          echo 'Toybox TAR integrity and extraction test passed.'

      - name: Build and verify APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Sign APK with METMC OS release key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.METMC_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.METMC_SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.METMC_SIGNING_KEY_ALIAS }}
        run: |
