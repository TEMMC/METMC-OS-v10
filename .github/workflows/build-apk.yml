name: Build METMC OS v10 APK

# METMC OS V10 v10.6.0 combined feature release; keep upgrade compatibility across alpha builds.
# Publish METMC OS V10 v10.6.0 only after the KDE Plasma build passes.
# Release publishing is gated on the commit message so only verified builds are published.
# Back-navigation, terminal startup, and package-update output fixes are included in this release build; shell variables are escaped for Kotlin.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "linux/config/**"
      - "linux/bridge-client/**"
      - "linux/setup/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: metmc-os-v10-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Restore METMC OS release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.METMC_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::Add the METMC_SIGNING_KEYSTORE_BASE64 repository secret before running this build."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/metmc-os-v10-release.keystore"
          test -s "$HOME/.android/metmc-os-v10-release.keystore"
          chmod 600 "$HOME/.android/metmc-os-v10-release.keystore"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Download upstream rootfs from official NativOS APK
        shell: bash
        run: |
          set -euo pipefail
          APK_URL="https://github.com/orailnoor/NativOS/releases/download/v0.1.0-alpha/NativOS-v0.1.0-alpha-arm64.apk"
          curl --fail --location --retry 3 --output /tmp/nativos-upstream.apk "$APK_URL"
          unzip -l /tmp/nativos-upstream.apk | grep -F "assets/rootfs/nativos-rootfs-arm64.tgz"
          mkdir -p android/app/src/main/assets/rootfs
          unzip -p /tmp/nativos-upstream.apk assets/rootfs/nativos-rootfs-arm64.tgz > android/app/src/main/assets/rootfs/nativos-rootfs-arm64.tgz
          test "$(stat -c %s android/app/src/main/assets/rootfs/nativos-rootfs-arm64.tgz)" -gt 104857600
          cd android/app/src/main/assets/rootfs
          sha256sum nativos-rootfs-arm64.tgz > nativos-rootfs-arm64.tgz.sha256
          sha256sum --check nativos-rootfs-arm64.tgz.sha256

      - name: Build and verify APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Sign APK with METMC OS release key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.METMC_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.METMC_SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.METMC_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          KEY="$HOME/.android/metmc-os-v10-release.keystore"
          if [[ -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Add METMC_SIGNING_STORE_PASSWORD, METMC_SIGNING_KEY_PASSWORD, and METMC_SIGNING_KEY_ALIAS repository secrets."
            exit 1
          fi
          keytool -list -keystore "$KEY" -storetype PKCS12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEY" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$APK.signed" "$APK"
          mv "$APK.signed" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package: name='com.temmc.metmcosv10'|application-label:'METMC OS V10'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-v10-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Publish METMC OS V10 v10.6.0')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: METMC-OS-v10-Android-APK
          path: release-assets

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -maxdepth 4 -print
          APK="$(find release-assets -type f -name 'app-debug.apk' -print -quit)"
          CHECKSUM="$(find release-assets -type f -name 'app-debug.apk.sha256' -print -quit)"
          test -n "$APK"
          test -n "$CHECKSUM"
          cp "$APK" METMC-OS-V10.6.0-arm64.apk
          (cd "$(dirname "$CHECKSUM")" && sha256sum "$(basename "$CHECKSUM")" >/dev/null)
          sha256sum METMC-OS-V10.6.0-arm64.apk > METMC-OS-V10.6.0-arm64.apk.sha256
          echo "Release APK prepared and checksum generated."

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.6.0
          name: METMC OS V10 10.6.0
          prerelease: true
          overwrite_files: true
          generate_release_notes: true
          body: |
            METMC OS V10 10.6.0 development release for Android ARM64. This alpha is signed with the METMC OS V10 release keystore.

            - Package ID: `com.temmc.metmcosv10`
            - App label: `METMC OS V10`
            - Based on the upstream NativOS project; upstream credits are retained.
            - METMC OS branding and updated launcher icon.
            - Hardware bridge improvements for battery/charging status, brightness controls, volume controls, and screen sleep/wake preferences.
            - Added opt-in system diagnostics export; the user chooses where to save the report, and private account/contact/message contents are excluded.
            - Added a guarded Linux package manager to refresh package lists, inspect available upgrades, explicitly confirm package upgrades, and install a single validated package name.
            - Package commands run inside the Linux root filesystem only; they do not update Android's host packages. Package upgrades are not automatically reversible.
            - Clipboard bridge hooks and improved touch-focus handling.
            - Live CPU/RAM/battery/storage monitor, shared-folder picker and Linux configuration backup with SHA-256.
            - Linux rootfs validation and update-center link; Linux software center uses guarded apt/dpkg.
            - Quick-access Tools menu, shorter METMC OS V10 app name, NativOS upstream attribution retained.
            - Default Home mode is configured to launch METMC OS V10 at boot.
            - Keyboard no longer opens on ordinary taps near the bottom of the desktop; use a three-finger tap to toggle it.
            - Improved Android/Linux clipboard text synchronization, including mixed plain-text and HTML clipboard items.
            - Removed the legacy root-shell redirect that could interfere with opening the terminal; Linux root password defaults to `metmc`.
            - Replaces the Phosh/Phoc session with KDE Plasma X11 and KWin, started directly on Android's embedded X11 display as the unprivileged Linux user `metmc`.
            - Retains METMC launchers for Bluetooth, display, sound, location, and Android system settings; Android remains the owner of physical radios.
            - Uses Konsole, Dolphin, and KDE System Settings as the default Plasma desktop tools.
            - Adds BlueZ/rfkill diagnostic utilities without starting a competing Linux radio manager.
            - This is an alpha build. KDE Plasma is heavier than Phosh; performance and first-boot package installation time must be checked on the target device.
            - APK is signed with the METMC OS V10 release keystore; this does not imply Play Store certification.
            - Package operations require root access, a provisioned Linux rootfs, and an internet connection. Review the operation log and close the Linux desktop before upgrades.
          files: |
            METMC-OS-V10.6.0-arm64.apk
            METMC-OS-V10.6.0-arm64.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
