name: Build METMC OS v10 APK

# METMC OS V10 Debian Trixie + Phosh mobile-shell experiment; validate before release.
# Keep the bundled rootfs lean; do not publish until the Phosh-only build passes device validation.
# Release publishing is gated on the commit message so only verified builds are published.
# Debian 13 Trixie supplies the matching packaged Phosh/Phoc 0.46 series for ARM64.
# Phosh/Phoc is the only desktop session; Xwayland supports legacy X11 apps.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "android/**"
      - "linux/config/**"
      - "linux/bridge-client/**"
      - "linux/setup/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

concurrency:
  group: metmc-os-v10-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Restore METMC OS release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.METMC_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "::error::Add the METMC_SIGNING_KEYSTORE_BASE64 repository secret before running this build."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/metmc-os-v10-release.keystore"
          test -s "$HOME/.android/metmc-os-v10-release.keystore"
          chmod 600 "$HOME/.android/metmc-os-v10-release.keystore"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build Debian 13 Trixie ARM64 rootfs offline-ready
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64 || true

          ROOTFS="$RUNNER_TEMP/metmc-rootfs"
          mkdir -p "$ROOTFS"
          sudo debootstrap --arch=arm64 --foreign --variant=minbase \
            --include=ca-certificates,apt \
            trixie "$ROOTFS" https://deb.debian.org/debian
          sudo cp /usr/bin/qemu-aarch64-static "$ROOTFS/usr/bin/qemu-aarch64-static"

          cleanup_mounts() {
            sudo umount "$ROOTFS/sys" 2>/dev/null || true
            sudo umount "$ROOTFS/proc" 2>/dev/null || true
            sudo umount "$ROOTFS/dev/pts" 2>/dev/null || true
            sudo umount "$ROOTFS/dev" 2>/dev/null || true
          }
          trap cleanup_mounts EXIT
          sudo mkdir -p "$ROOTFS/dev/pts" "$ROOTFS/proc" "$ROOTFS/sys"
          sudo mount --bind /dev "$ROOTFS/dev"
          sudo mount --bind /dev/pts "$ROOTFS/dev/pts"
          sudo mount -t proc proc "$ROOTFS/proc"
          sudo mount --bind /sys "$ROOTFS/sys"

          sudo chroot "$ROOTFS" /debootstrap/debootstrap --second-stage
          sudo chroot "$ROOTFS" /bin/bash -eu -c '
            rm -f /etc/apt/sources.list.d/debian.sources
            cat > /etc/apt/sources.list <<EOF
          deb https://deb.debian.org/debian trixie main
          deb https://deb.debian.org/debian trixie-updates main
          deb https://security.debian.org/debian-security trixie-security main
          EOF
            printf "metmc-os\n" > /etc/hostname
            printf "127.0.0.1 localhost\n127.0.1.1 metmc-os\n" > /etc/hosts
            rm -f /etc/resolv.conf
            printf "nameserver 1.1.1.1\nnameserver 8.8.8.8\n" > /etc/resolv.conf
          '

          # All downloads and package installation happen on the GitHub runner.
          # The finished APK embeds this complete Debian rootfs; Android startup
          # never performs apt operations or downloads the rootfs.
          sudo chroot "$ROOTFS" /usr/bin/env DEBIAN_FRONTEND=noninteractive apt-get update
          sudo chroot "$ROOTFS" /usr/bin/env DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC apt-get install -y --no-install-recommends \
            phosh phoc phosh-osk-stub xwayland dbus dbus-x11 dbus-user-session \
            polkitd pkexec foot thunar adwaita-icon-theme fonts-noto-core fonts-noto-color-emoji \
            sudo ca-certificates curl iproute2 iputils-ping procps psmisc

          sudo chroot "$ROOTFS" /bin/bash -eu -c '
            id -u metmc >/dev/null 2>&1 || useradd --create-home --shell /bin/bash metmc
            usermod -aG sudo metmc
            install -d -m 0755 /etc/sudoers.d
            printf "%s\n" "Defaults !requiretty" "metmc ALL=(ALL:ALL) NOPASSWD: ALL" > /etc/sudoers.d/metmc
            chmod 0440 /etc/sudoers.d/metmc
            passwd -l root >/dev/null 2>&1 || true
            command -v sudo >/dev/null
            test -x /usr/bin/phosh-session
            test -x /usr/bin/phoc
            test -x /usr/bin/Xwayland
            install -d -m 0755 /etc/phosh
            printf "%s\n" "[core]" "xwayland=true" > /etc/phosh/phoc.ini
            test -x /usr/bin/foot
            test -x /usr/bin/thunar
            test -x /usr/bin/curl
            test -x /usr/bin/ip
            test -x /usr/bin/ping
            apt-get purge -y flatpak flatpak-xdg-utils flatpak-builder gnome-software-plugin-flatpak xfce4-session xfce4-panel xfwm4 xfce4-settings xfce4-whiskermenu-plugin xfce4-pulseaudio-plugin gcc libxcb1-dev git wget nmap whois traceroute dnsutils net-tools netcat-openbsd openssh-client locales || true
            rm -rf /root/.local/share/flatpak /home/metmc/.local/share/flatpak /var/lib/flatpak /etc/flatpak /usr/share/flatpak
            apt-get autoremove --purge -y
            apt-get clean
            rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/* /var/cache/debconf/*
          '

          cleanup_mounts
          trap - EXIT
          sudo rm -f "$ROOTFS/usr/bin/qemu-aarch64-static"
          sudo chown -R "$USER":"$USER" "$ROOTFS"
          scripts/build-rootfs-asset.sh "$ROOTFS" android/app/src/main/assets/rootfs/nativos-rootfs-arm64.tgz
          cd android/app/src/main/assets/rootfs
          sha256sum nativos-rootfs-arm64.tgz > nativos-rootfs-arm64.tgz.sha256
          sha256sum --check nativos-rootfs-arm64.tgz.sha256

      - name: Build and verify APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Sign APK with METMC OS release key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.METMC_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.METMC_SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.METMC_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          KEY="$HOME/.android/metmc-os-v10-release.keystore"
          if [[ -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Add METMC_SIGNING_STORE_PASSWORD, METMC_SIGNING_KEY_PASSWORD, and METMC_SIGNING_KEY_ALIAS repository secrets."
            exit 1
          fi
          keytool -list -keystore "$KEY" -storetype PKCS12 -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEY" --ks-type PKCS12 --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$APK.signed" "$APK"
          mv "$APK.signed" "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")"
          grep -F "package: name='com.temmc.metmcosv10' versionCode='16' versionName='10.7.0'" <<< "$BADGING"
          grep -F "application-label:'METMC OS V10'" <<< "$BADGING"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: METMC-OS-v10-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Publish METMC OS V10 v10.7.0')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: METMC-OS-v10-Android-APK
          path: release-assets

      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -maxdepth 4 -print
          APK="$(find release-assets -type f -name 'app-debug.apk' -print -quit)"
          CHECKSUM="$(find release-assets -type f -name 'app-debug.apk.sha256' -print -quit)"
          test -n "$APK"
          test -n "$CHECKSUM"
          cp "$APK" METMC-OS-V10.7.0-arm64.apk
          (cd "$(dirname "$CHECKSUM")" && sha256sum "$(basename "$CHECKSUM")" >/dev/null)
          sha256sum METMC-OS-V10.7.0-arm64.apk > METMC-OS-V10.7.0-arm64.apk.sha256
          echo "Release APK prepared and checksum generated."

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.7.0
          name: METMC OS V10 10.7.0
          prerelease: true
          overwrite_files: true
          generate_release_notes: true
          body: |
            METMC OS V10 10.7.0 development release for Android ARM64. This alpha is signed with the METMC OS V10 release keystore.

            - Package ID: `com.temmc.metmcosv10`
            - App label: `METMC OS V10`
            - Based on the upstream NativOS project; upstream credits are retained.
            - METMC OS branding and updated launcher icon.
            - Hardware bridge improvements for battery/charging status, brightness controls, volume controls, and screen sleep/wake preferences.
            - Added opt-in system diagnostics export; the user chooses where to save the report, and private account/contact/message contents are excluded.
            - Added a guarded Linux package manager to refresh package lists, inspect available upgrades, explicitly confirm package upgrades, and install a single validated package name.
            - Package commands run inside the Linux root filesystem only; they do not update Android's host packages. Package upgrades are not automatically reversible.
            - Clipboard bridge hooks and improved touch-focus handling.
            - Live CPU/RAM/battery/storage monitor, shared-folder picker and Linux configuration backup with SHA-256.
            - Linux rootfs validation and update-center link; Linux software center uses guarded apt/dpkg.
            - Quick-access Tools menu, shorter METMC OS V10 app name, NativOS upstream attribution retained.
            - Default Home mode is configured to launch METMC OS V10 at boot.
            - Keyboard no longer opens on ordinary taps near the bottom of the desktop; use a three-finger tap to toggle it.
            - Improved Android/Linux clipboard text synchronization, including mixed plain-text and HTML clipboard items.
            - Removed the legacy root-shell redirect that could interfere with opening the terminal; the Linux root account is locked and administrative commands use `sudo` as `metmc`.
            - Uses a slim Debian 13 Trixie ARM64 rootfs with Phosh/Phoc 0.46, Xwayland, foot terminal, Thunar file manager, and only essential network/diagnostic tools. Xfce and its panel/window manager are not installed to save storage.
            - Retains METMC launchers for Bluetooth, display, sound, location, and Android system settings; Android remains the owner of physical radios.
            - Removed the Adreno-only Turnip driver because the Galaxy A04e uses PowerVR; Phoc uses its configured Pixman renderer. This avoids bundling an incompatible driver.
            - Removed developer and network-scanning packages from the default image; install optional tools manually when needed.
            - This is an alpha build. Phosh's nested compositor path, touch handling, virtual keyboard, GPU behavior, RAM use, and first-boot extraction time still need testing on the A04e.
            - APK is signed with the METMC OS V10 release keystore; this does not imply Play Store certification.
            - The bundled rootfs is a slim Debian 13 Trixie ARM64 image; boot and first launch require no package downloads. Manual package operations require root access, a provisioned Linux rootfs, and an internet connection. Review the operation log and close the Linux desktop before upgrades.
          files: |
            METMC-OS-V10.7.0-arm64.apk
            METMC-OS-V10.7.0-arm64.apk.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
