name: Build MT Bridge Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/app/src/main/java/com/nativOS/bridge/**"
      - "linux/bridge-client/**"
      - "linux/config/nativOS-bridge.service"
      - "linux/config/phoc.ini"
      - "linux/config/metmc-*.desktop"
      - "linux/setup/install-bridge.sh"
      - ".github/workflows/build-mt-desktop-bridge.yml"

permissions:
  contents: read

jobs:
  build-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout bridge source
        uses: actions/checkout@v4

      - name: Install bridge validation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-pytest shellcheck

      - name: Validate Linux bridge client and installer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile linux/bridge-client/nativOS-bridge.py
          python3 -m py_compile linux/bridge-client/metmc-settings.py
          python3 -m py_compile linux/bridge-client/metmc-wifi.py
          bash -n linux/setup/install-bridge.sh
          test -s linux/config/nativOS-bridge.service
          test -s linux/config/phoc.ini
          test -s android/app/src/main/java/com/nativOS/bridge/BridgeService.kt
          test -s android/app/src/main/java/com/nativOS/bridge/BridgeProtocol.kt
          shellcheck -S error linux/setup/install-bridge.sh

      - name: Assemble standalone bridge bundle
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/mt-bridge"
          mkdir -p "$OUT/linux/bridge-client" "$OUT/linux/config" "$OUT/linux/setup" \
            "$OUT/android-bridge-source"
          cp -a linux/bridge-client/. "$OUT/linux/bridge-client/"
          cp linux/config/nativOS-bridge.service linux/config/phoc.ini "$OUT/linux/config/"
          cp linux/config/metmc-*.desktop "$OUT/linux/config/"
          cp linux/setup/install-bridge.sh "$OUT/linux/setup/"
          cp -a android/app/src/main/java/com/nativOS/bridge/. "$OUT/android-bridge-source/"

          cat > "$OUT/README.txt" <<'EOF'
          MT OS standalone Android-Linux bridge bundle

          This artifact contains bridge source and Linux installation files only.
          MT-Phosh and MT-Phoc are intentionally NOT rebuilt or bundled here.

          Contents:
          - linux/bridge-client: Linux-side Python bridge clients
          - linux/config: bridge service, Phoc integration config, and launchers
          - linux/setup/install-bridge.sh: Ubuntu/Debian-oriented bridge installer
          - android-bridge-source: Android-side Kotlin bridge implementation

          The Android Kotlin source is provided for integration into the MT OS Android app;
          it is not a separately installable APK by itself.
          Install the Linux side inside the Ubuntu rootfs as root. Review launcher paths
          and Android socket permissions for the target runtime before enabling the service.
          EOF

          tar -czf "$RUNNER_TEMP/MT-Android-Linux-Bridge-arm64.tar.gz" -C "$OUT" .
          sha256sum "$RUNNER_TEMP/MT-Android-Linux-Bridge-arm64.tar.gz" | tee "$RUNNER_TEMP/SHA256SUMS.txt"
          tar -tzf "$RUNNER_TEMP/MT-Android-Linux-Bridge-arm64.tar.gz" | head -80

      - name: Upload standalone bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: MT-Android-Linux-Bridge-arm64
          path: |
            ${{ runner.temp }}/MT-Android-Linux-Bridge-arm64.tar.gz
            ${{ runner.temp }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
